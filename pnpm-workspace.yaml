# Native build-script approvals, declared for both pnpm majors in play:
#   - `allowBuilds` is what pnpm 12 (the local toolchain) reads.
#   - `onlyBuiltDependencies` is what pnpm 10 (pinned by netlify.toml) reads.
# pnpm 12 ignores the package.json `pnpm` field entirely, and pnpm 10 doesn't
# know `allowBuilds` — so each major needs its own key or some deps silently
# skip compilation. All five are the stack's own native deps: better-sqlite3
# backs @nuxt/content's local DB, sharp backs @nuxt/image, and esbuild /
# unrs-resolver / @parcel/watcher back the Vite build and dev watcher.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
